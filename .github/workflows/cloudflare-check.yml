name: NEXO Cloudflare Worker + D1 Check

on:
  push:
    branches:
      - "nexo/cloudflare-worker-runtime-20261010"
      - "main"
  pull_request:
    branches: ["main"]
    paths:
      - "wrangler.jsonc"
      - ".assetsignore"
      - "cloudflare/**"
      - ".github/workflows/cloudflare-check.yml"

jobs:
  worker-and-local-d1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test core schema contracts using isolated SQLite fixtures
        run: python3 -m unittest cloudflare.tests.test_core_schema
      - name: Apply initial migration to disposable local D1
        run: npx wrangler@latest d1 migrations apply nexo-production --local --config wrangler.jsonc
      - name: Verify core tables exist locally
        run: npx wrangler@latest d1 execute nexo-production --local --config wrangler.jsonc --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('users','catalog_items','inventory','wallet_ledger') ORDER BY name"
      - name: Validate Worker bundle and bindings
        run: npx wrangler@latest deploy --dry-run --config wrangler.jsonc --outdir=.wrangler-root-dry-run

  migrate-production-d1:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: cad0851a8cee9e5a424bddc832475aa2
    steps:
      - name: Check whether remote migration credentials are available
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.credentials.outputs.available == 'true'
      - uses: actions/setup-node@v4
        if: steps.credentials.outputs.available == 'true'
        with:
          node-version: 22
      - name: Apply reviewed initial schema to production D1
        if: steps.credentials.outputs.available == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler@latest d1 migrations apply nexo-production --remote --config wrangler.jsonc
      - name: Verify production core schema
        if: steps.credentials.outputs.available == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler@latest d1 execute nexo-production --remote --config wrangler.jsonc --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('users','catalog_items','inventory','wallet_ledger') ORDER BY name"
      - name: Report remote migration blocker when credentials are missing
        if: steps.credentials.outputs.available != 'true'
        run: echo "::warning::CLOUDFLARE_API_TOKEN is not configured in GitHub Actions secrets; remote D1 migration was not applied."

  production-health:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Worker runtime deployment and verify health + D1 binding
        shell: bash
        run: |
          set -u
          url="https://nexo-prototype.meslammohamed423.workers.dev/health"
          for attempt in $(seq 1 30); do
            response="$(curl --silent --show-error --max-time 12 "$url" || true)"
            echo "Attempt $attempt: $response"
            if echo "$response" | grep -q '"ok":true' && echo "$response" | grep -q '"database":"ok"'; then
              if echo "$response" | grep -q '"schema":"ready"'; then
                echo "Worker runtime, D1 connection, and core schema are ready."
                exit 0
              fi
              echo "Worker and D1 are reachable, but the core schema is not ready yet."
            fi
            sleep 10
          done
          echo "Health check did not confirm database=ok and schema=ready. Inspect Cloudflare deployment and the production migration job."
          exit 1
