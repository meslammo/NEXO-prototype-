name: NEXO Cloudflare Worker + D1 Check

on:
  push:
    branches:
      - "nexo/cloudflare-worker-runtime-20261010"
      - "main"
  pull_request:
    branches: ["main"]
    paths:
      - "wrangler.jsonc"
      - ".assetsignore"
      - "cloudflare/**"
      - ".github/workflows/cloudflare-check.yml"

jobs:
  worker-and-local-d1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test core schema contracts using isolated SQLite fixtures
        run: python3 -m unittest cloudflare.tests.test_core_schema
      - name: Apply initial migration to disposable local D1
        run: npx wrangler@latest d1 migrations apply nexo-production --local --config wrangler.jsonc
      - name: Verify core tables exist locally
        run: npx wrangler@latest d1 execute nexo-production --local --config wrangler.jsonc --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('users','catalog_items','inventory','wallet_ledger') ORDER BY name"
      - name: Validate Worker bundle and bindings
        run: npx wrangler@latest deploy --dry-run --config wrangler.jsonc --outdir=.wrangler-root-dry-run

  migrate-production-d1:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: cad0851a8cee9e5a424bddc832475aa2
    steps:
      - name: Check whether remote migration credentials are available
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.credentials.outputs.available == 'true'
      - uses: actions/setup-node@v4
        if: steps.credentials.outputs.available == 'true'
        with:
          node-version: 22
      - name: Apply reviewed initial schema to production D1
        if: steps.credentials.outputs.available == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler@latest d1 migrations apply nexo-production --remote --config wrangler.jsonc
      - name: Verify production core schema
        if: steps.credentials.outputs.available == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler@latest d1 execute nexo-production --remote --config wrangler.jsonc --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('users','catalog_items','inventory','wallet_ledger') ORDER BY name"
      - name: Report remote migration blocker when credentials are missing
        if: steps.credentials.outputs.available != 'true'
        run: echo "::warning::CLOUDFLARE_API_TOKEN is not configured in GitHub Actions secrets; remote D1 migration was not applied."

  production-health:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Worker health and verify D1 connectivity
        id: health
        shell: bash
        run: |
          set -u
          url="https://nexo-prototype.meslammohamed423.workers.dev/health"
          database_ready=false
          schema_ready=false
          for attempt in $(seq 1 30); do
            response="$(curl --silent --show-error --max-time 12 "$url" || true)"
            echo "Attempt $attempt: $response"
            if echo "$response" | grep -q '"ok":true' && echo "$response" | grep -q '"database":"ok"'; then
              database_ready=true
              if echo "$response" | grep -q '"schema":"ready"'; then
                schema_ready=true
                break
              fi
              echo "D1 responds, but the account/store/wallet schema is not ready yet."
            fi
            sleep 10
          done
          echo "database_ready=$database_ready" >> "$GITHUB_OUTPUT"
          echo "schema_ready=$schema_ready" >> "$GITHUB_OUTPUT"
          if [ "$database_ready" != "true" ]; then
            echo "Worker runtime or D1 binding did not become healthy."
            exit 1
          fi

      - name: Non-mutating auth, wallet-guard, and market API smoke tests
        if: steps.health.outputs.database_ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          base="https://nexo-prototype.meslammohamed423.workers.dev/api/nexo"

          login_status="$(curl --silent --show-error --max-time 15 -o /tmp/login.json -w '%{http_code}' \
            -X POST "$base/auth/login" -H 'content-type: application/json' -d '{}')"
          echo "Empty-login validation HTTP status: $login_status"
          test "$login_status" = "400"
          grep -q 'LOGIN_REQUIRED' /tmp/login.json

          register_status="$(curl --silent --show-error --max-time 15 -o /tmp/register.json -w '%{http_code}' \
            -X POST "$base/auth/register" -H 'content-type: application/json' -d '{}')"
          echo "Empty-registration validation HTTP status: $register_status"
          test "$register_status" = "400"
          grep -q 'INVALID_INPUT' /tmp/register.json

          wallet_status="$(curl --silent --show-error --max-time 15 -o /tmp/wallet.json -w '%{http_code}' \
            "$base/wallet")"
          echo "Unauthenticated wallet HTTP status: $wallet_status"
          test "$wallet_status" = "401"

          catalog_status="$(curl --silent --show-error --max-time 15 -o /tmp/catalog.json -w '%{http_code}' \
            "$base/catalog?market=1")"
          echo "Public market catalogue HTTP status: $catalog_status"
          test "$catalog_status" = "200"
          python3 - <<'PY'
          import json
          from pathlib import Path
          catalog = json.loads(Path("/tmp/catalog.json").read_text())
          assert isinstance(catalog, list), "Catalog response must be a JSON array"
          assert len(catalog) > 0, "Public catalog returned no active market items"
          print(f"Market catalogue returned {len(catalog)} items.")
          PY

          gifts_status="$(curl --silent --show-error --max-time 15 -o /tmp/gifts.json -w '%{http_code}' \
            "$base/gifts")"
          echo "Public gifts HTTP status: $gifts_status"
          test "$gifts_status" = "200"
          python3 - <<'PY'
          import json
          from pathlib import Path
          gifts = json.loads(Path("/tmp/gifts.json").read_text())
          assert isinstance(gifts, list), "Gifts response must be a JSON array"
          print(f"Gifts endpoint returned {len(gifts)} items.")
          PY

      - name: Require the D1 core schema before declaring the migration ready
        if: steps.health.outputs.schema_ready != 'true'
        run: |
          echo "D1 is reachable, but tables users/catalog_items/inventory/wallet_ledger are missing. Configure the GitHub Actions secret CLOUDFLARE_API_TOKEN to run the remote migration, then re-run this check."
          exit 1
