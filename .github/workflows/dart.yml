name: Flutter CI

on:
  push:
      branches: [main]
        pull_request:
            branches: [main]
              workflow_dispatch:

              jobs:
  build:
                    runs-on: ubuntu-latest

                        steps:
                              - name: Checkout
                                      uses: actions/checkout@v4

                                            - name: Setup Flutter
                                                    uses: subosito/flutter-action@v2
                                                            with:
                                                                      channel: stable
                                                                                cache: true

                                                                                      - name: Flutter version
                                                                                              run: flutter --version

                                                                                                    - name: Get dependencies
                                                                                                            run: flutter pub get

                                                                                                                  - name: Analyze
                                                                                                                          run: flutter analyze

                                                                                                                                - name: Tests
                                                                                                                                        run: flutter test