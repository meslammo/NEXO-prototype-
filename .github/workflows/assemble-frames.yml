name: NEXO Assemble 30 Original Frames

on:
  push:
    branches: ["nexo/fullstack-phases-1-10"]
    paths:
      - ".ci/frame_upload/**"

permissions:
  contents: write
  actions: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: nexo/fullstack-phases-1-10

      - name: Verify upload parts
        shell: bash
        run: |
          set -euo pipefail
          count=$(find .ci/frame_upload -maxdepth 1 -type f -name 'part*.b64' | wc -l | tr -d ' ')
          test "$count" = "50"

      - name: Rebuild exact frame archive
        shell: bash
        run: |
          set -euo pipefail
          cat .ci/frame_upload/part*.b64 | tr -d '\r\n ' | base64 --decode > /tmp/nexo_frames_original_30.tar.gz
          echo "cea19b6393ed93dcca8679d86477c7edf9159e99221eb9230724b5837de7c8b4  /tmp/nexo_frames_original_30.tar.gz" | sha256sum -c -
          rm -rf /tmp/nexo_frames
          mkdir -p /tmp/nexo_frames
          tar -xzf /tmp/nexo_frames_original_30.tar.gz -C /tmp/nexo_frames
          test "$(find /tmp/nexo_frames/original_30 -maxdepth 1 -type f -name '*.png' | wc -l | tr -d ' ')" = "30"

      - name: Install 30 PNG assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/nexo/frames/original_30
          cp -f /tmp/nexo_frames/original_30/*.png assets/nexo/frames/original_30/
          test "$(find assets/nexo/frames/original_30 -maxdepth 1 -type f -name '*.png' | wc -l | tr -d ' ')" = "30"

      - name: Patch runtime asset paths
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          files = [
              "frame-01-sunrise.png","frame-02-simple-gold.png","frame-03-ocean-wave.png","frame-04-papyrus-ring.png",
              "frame-05-desert-oasis.png","frame-06-balloon-party.png","frame-07-zodiac.png","frame-08-bronze-lv10.png","frame-09-bonded-hearts.png",
              "frame-10-crystal-ring.png","frame-11-warrior.png","frame-12-love-bloom.png","frame-13-silver-lv25.png","frame-14-ramadan-lantern.png",
              "frame-15-fire-lion.png","frame-16-diamond-princess.png","frame-17-golden-wings.png","frame-18-gold-lv50.png","frame-19-frame-19.png",
              "frame-20-eternal-bond.png","frame-21-noble.png","frame-22-scribe.png","frame-23-vizier.png","frame-24-platinum-lv100.png",
              "frame-25-anniversary.png","frame-26-high-priest.png","frame-27-nomarch.png","frame-28-pharaoh.png","frame-29-mythic-lv200.png",
              "frame-30-new-year.png"
          ]
          asset = "assets/nexo/frames/original_30/"
          p = Path("lib/models/nexo_catalog.dart")
          s = p.read_text()
          for fn in files:
              s = s.replace("image:'" + fn + "'", "image:'" + asset + fn + "'")
          p.write_text(s)
          p = Path("backend/schema.sql")
          s = p.read_text()
          for fn in files:
              s = s.replace("'" + fn + "'", "'" + asset + fn + "'")
          p.write_text(s)
          p = Path("assets/nexo/frames/frames36_manifest.json")
          s = p.read_text()
          for fn in files:
              s = s.replace('"image": "' + fn + '"', '"image": "' + asset + fn + '"')
          p.write_text(s)
          PY

      - name: Verify runtime references and hashes
        shell: bash
        run: |
          set -euo pipefail
          for fn in \
            frame-01-sunrise.png frame-02-simple-gold.png frame-03-ocean-wave.png frame-04-papyrus-ring.png \
            frame-05-desert-oasis.png frame-06-balloon-party.png frame-07-zodiac.png frame-08-bronze-lv10.png frame-09-bonded-hearts.png \
            frame-10-crystal-ring.png frame-11-warrior.png frame-12-love-bloom.png frame-13-silver-lv25.png frame-14-ramadan-lantern.png \
            frame-15-fire-lion.png frame-16-diamond-princess.png frame-17-golden-wings.png frame-18-gold-lv50.png frame-19-frame-19.png \
            frame-20-eternal-bond.png frame-21-noble.png frame-22-scribe.png frame-23-vizier.png frame-24-platinum-lv100.png \
            frame-25-anniversary.png frame-26-high-priest.png frame-27-nomarch.png frame-28-pharaoh.png frame-29-mythic-lv200.png frame-30-new-year.png
          do
            test -s "assets/nexo/frames/original_30/$fn"
          done
          grep -q "assets/nexo/frames/original_30/frame-01-sunrise.png" lib/models/nexo_catalog.dart
          grep -q '"image": "assets/nexo/frames/original_30/frame-01-sunrise.png"' assets/nexo/frames/frames36_manifest.json
          sha256sum assets/nexo/frames/original_30/*.png > assets/nexo/frames/original_30/sha256sums.txt

      - name: Commit assets into branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/nexo/frames/original_30 lib/models/nexo_catalog.dart backend/schema.sql assets/nexo/frames/frames36_manifest.json
          rm -rf .ci/frame_upload
          git add -u
          git rm .github/workflows/assemble-frames.yml >/dev/null 2>&1 || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "NEXO FRAMES 02: install 30 original PNG assets"
          git push origin HEAD:nexo/fullstack-phases-1-10

      - name: Dispatch final Android build
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/build-apk.yml/dispatches" \
            -d '{"ref":"nexo/fullstack-phases-1-10"}'
