name: Build NEXO APK

on:
  workflow_dispatch:
  push:
    branches: ["nexo/fullstack-phases-1-10"]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true
      - name: Flutter pub get
        run: flutter pub get
      - name: Ensure Android host project
        run: |
          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            flutter create --platforms=android --project-name nexo_app --org com.example .
          fi
          test -f android/app/build.gradle || test -f android/app/build.gradle.kts
      - name: Analyze (non-blocking)
        run: flutter analyze || true
      - name: Regenerate supported Android host project
        run: flutter create --platforms=android --project-name nexo_app --org com.example .
      - name: Configure stable release signing when secrets are available
        env:
          NEXO_KEYSTORE_BASE64: ${{ secrets.NEXO_KEYSTORE_BASE64 }}
          NEXO_KEY_ALIAS: ${{ secrets.NEXO_KEY_ALIAS }}
          NEXO_KEY_PASSWORD: ${{ secrets.NEXO_KEY_PASSWORD }}
          NEXO_STORE_PASSWORD: ${{ secrets.NEXO_STORE_PASSWORD }}
        run: |
          if [ -n "$NEXO_KEYSTORE_BASE64" ]; then
            echo "$NEXO_KEYSTORE_BASE64" | base64 --decode > android/app/nexo-release.jks
            cat > android/key.properties <<EOF
storePassword=$NEXO_STORE_PASSWORD
keyPassword=$NEXO_KEY_PASSWORD
keyAlias=$NEXO_KEY_ALIAS
storeFile=nexo-release.jks
EOF
            python3 - <<'PY'
from pathlib import Path

if Path("android/app/build.gradle").exists():
    p=Path("android/app/build.gradle")
    s=p.read_text()
    prefix='''def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) { keystoreProperties.load(new FileInputStream(keystorePropertiesFile)) }
'''
    if "keystorePropertiesFile" not in s:
        s=prefix+s
    if "signingConfigs {" not in s:
        s=s.replace("android {", '''android {
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }''',1)
    s=s.replace("signingConfig signingConfigs.debug","signingConfig (keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug)")
    p.write_text(s)

elif Path("android/app/build.gradle.kts").exists():
    p=Path("android/app/build.gradle.kts")
    s=p.read_text()
    prefix='''import java.io.FileInputStream
import java.util.Properties

val keystoreProperties = Properties()
val keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(FileInputStream(keystorePropertiesFile))
}

'''
    if "keystorePropertiesFile" not in s:
        s=prefix+s
    if "create("release")" not in s:
        s=s.replace("    buildTypes {", '''    signingConfigs {
        create("release") {
            if (keystorePropertiesFile.exists()) {
                keyAlias = keystoreProperties["keyAlias"] as String?
                keyPassword = keystoreProperties["keyPassword"] as String?
                storeFile = (keystoreProperties["storeFile"] as String?)?.let { file(it) }
                storePassword = keystoreProperties["storePassword"] as String?
            }
        }
    }

    buildTypes {''',1)
    s=s.replace(
        'signingConfig = signingConfigs.getByName("debug")',
        'signingConfig = if (keystorePropertiesFile.exists()) signingConfigs.getByName("release") else signingConfigs.getByName("debug")',
        1
    )
    p.write_text(s)
else:
    raise SystemExit("No Android Gradle build file found")
PY
          else
            echo "No NEXO release keystore secrets configured; using CI debug signing for test builds."
          fi

      - name: Patch network and call permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("android/app/src/main/AndroidManifest.xml")
          s=p.read_text()
          perms=[
            'android.permission.INTERNET',
            'android.permission.RECORD_AUDIO',
            'android.permission.CAMERA',
          ]
          for perm in perms:
            line=f'  <uses-permission android:name="{perm}"/>'
            if f'android.permission.{perm.split(".")[-1]}' not in s:
              s=s.replace("</manifest>", line+"\n</manifest>")
          p.write_text(s)
          PY
      - name: Build APK
        run: flutter build apk --release --dart-define=NEXO_API_URL=https://nexo-api-production-05d3.up.railway.app
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nexo-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
