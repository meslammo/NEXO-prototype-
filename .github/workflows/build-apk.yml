name: Build NEXO APK

on:
  workflow_dispatch:
  push:
    branches: ["nexo/fullstack-phases-1-10"]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true
      - name: Flutter pub get
        run: flutter pub get
      - name: Ensure Android host project
        run: |
          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            flutter create --platforms=android --project-name nexo_app --org com.example .
          fi
          test -f android/app/build.gradle || test -f android/app/build.gradle.kts
      - name: Analyze (non-blocking)
        run: flutter analyze || true
      - name: Regenerate supported Android host project
        run: flutter create --platforms=android --project-name nexo_app --org com.example .
      - name: Configure stable release signing when secrets are available
        env:
          NEXO_KEYSTORE_BASE64: ${{ secrets.NEXO_KEYSTORE_BASE64 }}
          NEXO_KEY_ALIAS: ${{ secrets.NEXO_KEY_ALIAS }}
          NEXO_KEY_PASSWORD: ${{ secrets.NEXO_KEY_PASSWORD }}
          NEXO_STORE_PASSWORD: ${{ secrets.NEXO_STORE_PASSWORD }}
        run: python3 scripts/configure_android_signing.py

      - name: Patch network and call permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("android/app/src/main/AndroidManifest.xml")
          s=p.read_text()
          perms=[
            'android.permission.INTERNET',
            'android.permission.RECORD_AUDIO',
            'android.permission.CAMERA',
          ]
          for perm in perms:
            line=f'  <uses-permission android:name="{perm}"/>'
            if f'android.permission.{perm.split(".")[-1]}' not in s:
              s=s.replace("</manifest>", line+"\n</manifest>")
          p.write_text(s)
          PY
      - name: Build APK
        run: flutter build apk --release --dart-define=NEXO_API_URL=https://nexo-api-production-05d3.up.railway.app
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nexo-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
