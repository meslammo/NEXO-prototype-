<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXO Settings</title><link rel="stylesheet" href="../assets/nexo.css"></head><body><main><section class="hero"><h1>⚙ Settings</h1><p class="muted">واجهة إعدادات الحساب والخصوصية والتنبيهات.</p></section><div class="card"><label>Display Name</label><input id="name" value=""><label>Name Color</label><input id="color" type="color" value="#54d6ff"><label><input id="glow" type="checkbox" checked> Dynamic Glow</label><button class="btn primary" onclick="saveSettings()">حفظ</button><a class="btn" href="../index.html">Home</a></div><div class="grid" style="margin-top:14px"><div class="card"><h3>🔔 Notifications</h3><p>Push notifications جاهزة للربط بالـBackend.</p></div><div class="card"><h3>🔐 Privacy</h3><p>إعدادات الخصوصية والصلاحيات.</p></div><div class="card"><h3>🛡 Security</h3><p>2FA + Session control + Server-side anti-cheat.</p></div></div><script src="../assets/nexo.js"></script><script>document.getElementById("name").value=NEXO.user.name;document.getElementById("color").value=NEXO.user.color;document.getElementById("glow").checked=NEXO.user.glow;function saveSettings(){NEXO.user.name=document.getElementById("name").value||"NEXO Player";NEXO.user.color=document.getElementById("color").value;NEXO.user.glow=document.getElementById("glow").checked;NEXO.save();NEXO.toast("تم الحفظ");}</script></body></html>
